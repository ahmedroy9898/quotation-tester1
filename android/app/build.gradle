plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def flutterRoot = rootProject.projectDir.parentFile.absolutePath
def flutterProperties = new Properties()
flutterProperties.load(new FileInputStream(new File(flutterRoot, '.flutter')))

flutter {
    source = flutterRoot
}

android {
    namespace "com.almubarak.almubarak_quotation"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.almubarak.almubarak_quotation"
        minSdk flutter.minSdkVersion
        targetSdk flutter.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

dependencies {
    implementation "io.flutter:flutter_embedding_release"
}
